spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  calendar-sync:
    enabled: false
    fixed-delay-ms: 3600000
    initial-delay-ms: 3600000
  rate-limit:
    # Désactivé par défaut en tests pour ne pas casser les suites existantes
    enabled: false
    login:
      max-requests: 1000
      window-ms: 60000
    register:
      max-requests: 1000
      window-ms: 60000
    booking:
      max-requests: 1000
      window-ms: 60000
    sync:
      max-requests: 1000
      window-ms: 60000