server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/airbnb_spa
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  init-demo-data: false
  jwt:
    # Secret HS256 (>= 32 caractères). À surcharger via JWT_SECRET en prod.
    secret: ${JWT_SECRET:change-me-airbnb-spa-jwt-secret-key-32b}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  calendar-sync:
    # Synchronisation périodique des URL iCal (Airbnb / Booking)
    # Défaut: 10 min (600000 ms) — bon compromis réactivité / charge pour 1 listing
    enabled: ${CALENDAR_SYNC_ENABLED:true}
    fixed-delay-ms: ${CALENDAR_SYNC_FIXED_DELAY_MS:600000}
    initial-delay-ms: ${CALENDAR_SYNC_INITIAL_DELAY_MS:60000}
  rate-limit:
    # Limite le spam sur login / register / booking / sync (par IP)
    # Assez large pour les tests manuels locaux ; resserrer en prod via env
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      max-requests: ${RATE_LIMIT_LOGIN_MAX:20}
      window-ms: ${RATE_LIMIT_LOGIN_WINDOW_MS:60000}
    register:
      max-requests: ${RATE_LIMIT_REGISTER_MAX:10}
      window-ms: ${RATE_LIMIT_REGISTER_WINDOW_MS:600000}
    booking:
      max-requests: ${RATE_LIMIT_BOOKING_MAX:15}
      window-ms: ${RATE_LIMIT_BOOKING_WINDOW_MS:900000}
    sync:
      max-requests: ${RATE_LIMIT_SYNC_MAX:30}
      window-ms: ${RATE_LIMIT_SYNC_WINDOW_MS:600000}