<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>Connexion</h1>
      <p class="text-light">Accédez à votre espace personnel</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error">
        <span class="alert-icon">✕</span>
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Nom d'utilisateur</label>
        <input
          id="username"
          type="text"
          class="form-control"
          [class.is-invalid]="f['username'].touched && f['username'].invalid"
          formControlName="username"
          placeholder="Votre nom d'utilisateur"
        />
        @if (f['username'].touched && f['username'].invalid) {
          <div class="form-error">Le nom d'utilisateur est requis</div>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [class.is-invalid]="f['password'].touched && f['password'].invalid"
          formControlName="password"
          placeholder="Votre mot de passe"
        />
        @if (f['password'].touched && f['password'].invalid) {
          <div class="form-error">Le mot de passe est requis</div>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="loading">
        @if (loading) {
          <span class="spinner spinner-sm"></span>
        }
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
